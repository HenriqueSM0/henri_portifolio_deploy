<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projetos - Henrique Siqueira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d6edb;
            --text: #ffffff;
            --text-muted: #a8f0ed;
            --accent: #c4eaff;
            --border: rgba(255,255,255,0.22);
            --glass: rgba(255,255,255,0.07);
            --glass-hover: rgba(255,255,255,0.12);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0d6edb 0%, #0852a8 40%, #0640c7 70%, #1992f5 100%);
            background-attachment: fixed;
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse 60% 50% at 80% 20%, rgba(100,180,255,0.15) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 10% 80%, rgba(0,50,200,0.2) 0%, transparent 70%);
            pointer-events: none;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            pointer-events: none;
        }
        .orb-1 { width: 350px; height: 350px; background: #4db8ff; top: -80px; right: -80px; animation: drift 18s ease-in-out infinite; }
        .orb-2 { width: 250px; height: 250px; background: #0022ff; bottom: 15%; left: -60px; animation: drift 22s ease-in-out infinite reverse; }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(20px, -30px); }
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            padding: 72px 28px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 56px;
            animation: fadeUp 0.7s ease both;
        }

        .page-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            font-weight: 800;
            letter-spacing: -0.04em;
            background: linear-gradient(135deg, #fff 0%, #c4eaff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--glass);
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .back-link:hover {
            color: #fff;
            background: var(--glass-hover);
            transform: translateX(-3px);
        }

        .back-link svg { width: 14px; height: 14px; }

        /* Counter */
        .projects-count {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 24px;
        }
        .projects-count::before {
            content: '';
            display: block;
            width: 20px;
            height: 1px;
            background: var(--accent);
            opacity: 0.5;
        }

        /* Projects list */
        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            list-style: none;
        }

        .project-card {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 28px 32px;
            backdrop-filter: blur(14px);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
        }

        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
        }

        .project-card.visible {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.5s ease, transform 0.5s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .project-card:hover {
            background: var(--glass-hover);
            border-color: rgba(196,234,255,0.3);
            transform: translateY(-4px) !important;
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
        }

        .project-num {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            color: rgba(196,234,255,0.4);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .project-card h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 10px;
            color: #fff;
        }

        .project-card p {
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.7;
            margin-bottom: 20px;
            font-weight: 300;
        }

        .card-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .github-link, .youtube-link {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 7px 16px;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .github-link {
            color: rgba(255,255,255,0.85);
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.18);
        }

        .github-link:hover {
            background: rgba(255,255,255,0.16);
            transform: translateY(-2px);
        }

        .youtube-link {
            color: #ff8a80;
            background: rgba(255,100,80,0.1);
            border: 1px solid rgba(255,100,80,0.2);
        }

        .youtube-link:hover {
            background: rgba(255,100,80,0.18);
            transform: translateY(-2px);
        }

        .github-link svg, .youtube-link svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        /* Footer */
        .footer {
            margin-top: 72px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.35);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .container { padding: 48px 18px; }
            .page-header { flex-direction: column; align-items: flex-start; gap: 16px; }
            .project-card { padding: 22px; }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">

        <header class="page-header">
            <h1>Meus projetos</h1>
            <a href="/" class="back-link">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                </svg>
                Voltar
            </a>
        </header>

        <span class="projects-count">Trabalhos selecionados</span>

        <ul class="projects-list">
            {% for proj in projetos %}
            <li class="project-card">
                <div class="project-num">{{ forloop.counter|stringformat:"02d" }}</div>
                <h2>{{ proj.1 }}</h2>
                <p>{{ proj.2 }}</p>
                <div class="card-links">
                    <a href="{{ proj.3 }}" class="github-link" target="_blank" rel="noopener noreferrer">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                        </svg>
                        Repositório GitHub
                    </a>
                    {% if proj.4 %}
                    <a href="{{ proj.4 }}" class="youtube-link" target="_blank" rel="noopener noreferrer">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 358" fill="currentColor">
                            <path d="M501,56c-6-22-23-39-45-45C416,0,256,0,256,0S96,0,56,11C34,17,17,34,11,56C0,96,0,179,0,179s0,83,11,123c6,22,23,39,45,45c40,11,200,11,200,11s160,0,200-11c22-6,39-23,45-45c11-40,11-123,11-123S512,96,501,56z"/>
                            <polygon points="205 102 205 255 338 179 205 102" fill="white"/>
                        </svg>
                        Demonstração YouTube
                    </a>
                    {% endif %}
                </div>
            </li>
            {% endfor %}
        </ul>

        <footer class="footer">
            <p>&copy; 2026 Henrique Siqueira</p>
        </footer>
    </div>

    <script>
        // Staggered card reveal on scroll
        const cards = document.querySelectorAll('.project-card');
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry, i) => {
                if (entry.isIntersecting) {
                    setTimeout(() => {
                        entry.target.classList.add('visible');
                    }, i * 80);
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        cards.forEach(card => observer.observe(card));

        // Parallax orbs
        document.addEventListener('mousemove', e => {
            const x = (e.clientX / window.innerWidth - 0.5) * 14;
            const y = (e.clientY / window.innerHeight - 0.5) * 14;
            document.querySelector('.orb-1').style.transform = `translate(${x}px, ${y}px)`;
        });
    </script>
</body>
</html>
